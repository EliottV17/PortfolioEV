    content:
      en:
        detail: 'Engineered a high-performance matching engine utilizing PostGIS to resolve and optimize complex geospatial queries for low-latency proximity searches.'
        highlights:
          - 'Geospatial discovery: ordered by real distance with PostGIS ST_Distance, excluding already-swiped users'
          - 'Race-safe matching: composite unique indexes on swipes and matches, duplicate swipes handled via 409'
      es:
        detail: 'Motor de emparejamiento de alto rendimiento que utiliza PostGIS para resolver y optimizar consultas geoespaciales complejas en búsquedas por proximidad de baja latencia.'
        highlights:
          - 'Descubrimiento geoespacial: orden por distancia real con ST_Distance de PostGIS, excluyendo usuarios ya swipeados'
          - 'Matching seguro ante concurrencia: índices únicos compuestos en swipes y matches, swipes duplicados resueltos con 409'
  - id: tenantInbox
    name: TenantInbox
    links:
      github: https://github.com/EliottV17/TenantInbox
      web: https://tenant-inbox-ten.vercel.app/inbox
    stack:
      - Next.js (App Router)
      - TypeScript
      - Convex
      - OpenRouter (GLM-5.3-flash)
      - Zod 4
      - Tailwind CSS v4
      - shadcn/ui
      - Bun
      - Vitest
    color: green
    techIcon: ts
    filename: tenantinbox.ts
    diagram: |
      ┌─────────────────┐   ┌─────────────────┐
      │   Inbox form    │   │  POST webhook   │
      └────────┬────────┘   └────────┬────────┘
               │                     │
               ▼                     ▼
      ┌─────────────────┐   ┌─────────────────┐
      │ Create mutation │   │ Webhook handler │
      └────────┬────────┘   └────────┬────────┘
               └──────────┬──────────┘
                          ▼
              ┌───────────────────────┐
              │   Save message: new   │
              └───────────┬───────────┘
                          │
                          ▼
             ┌─────────────────────────┐
             │ Schedule classification │
             └────────────┬────────────┘
                          │
                          ▼
              ┌───────────────────────┐
              │ Classification action │
              └───────────┬───────────┘
                          │
                          ▼
               ┌─────────────────────┐
               │ State + usage guard │
               └──────────┬──────────┘
                          │
                          ▼
          ┌───────────────────────────────┐
          │ OpenRouter structured output  │
          └───────────────┬───────────────┘
                          │
                          ▼
         ┌─────────────────────────────────┐
         │ Parse JSON + validate with Zod  │
         └─────┬─────────────────────┬─────┘
               │                     │
               ▼                     ▼
        ┌─────────────┐       ┌─────────────┐
        │ Save result │       │ Mark failed │
        └──────┬──────┘       └──────┬──────┘
               └──────────┬──────────┘
                          ▼
                 ┌─────────────────┐
                 │ Reactive inbox  │
                 └────────┬────────┘
                          │
                          ▼
             ┌─────────────────────────┐
             │ Human reviews and acts  │
             └─────────────────────────┘
    content:
      en:
        detail: 'Real-time web platform that centralizes tenant messages received via form and webhook. An AI agent classifies them by category and urgency, writes a summary and drafts a reply that a person reviews and approves before sending.'
        highlights:
          - 'State-machine pipeline: idempotent transitions (new → classifying → classified | failed)'
          - 'Webhook with shared secret and constant-time comparison; daily classification cap'
          - 'Zod as single source of truth: validates model output and generates the JSON Schema'
      es:
        detail: 'Plataforma web en tiempo real que centraliza los mensajes de inquilinos recibidos por formulario y webhook. Un agente de IA los clasifica por categoría y urgencia, genera un resumen y propone un borrador de respuesta que una persona revisa y aprueba antes de enviarlo.'
        highlights:
          - 'Pipeline como máquina de estados: transiciones idempotentes (new → classifying → classified | failed)'
          - 'Webhook con secreto compartido y comparación en tiempo constante; tope diario de clasificaciones'
          - 'Zod como fuente única de verdad: valida la respuesta del modelo y genera el JSON Schema'
