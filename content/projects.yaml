projects:
  - id: sentinel
    name: Sentinel
    links:
      github: https://github.com/EliottV17/sentinel-project
      video: https://youtu.be/0To4e1rmMRM
      web: https://sentinel.eliottvelarde.com/status
    stack:
      - TypeScript
      - NestJS
      - Go
      - PostgreSQL
      - React
      - Docker
      - AWS EC2
    color: red
    techIcon: ts
    diagram: |1
     
            ┌────────────────────────┐
            │ Browser / React Client │
            └───────────┬────────────┘
                        │ HTTPS
                        ▼
          ┌─────────────┴────────────────┐
          │     Caddy reverse proxy      │
          │      (production edge)       │
          └──┬────────────────────┬──────┘
             │ other paths        │ /api/* (direct)
             ▼                    ▼
      ┌─────────────┐   ┌───────────────────┐
      │ Nginx (UI)  │   │  NestJS REST API  │
      │ static SPA  │   │ (JWT auth & CRUD) │
      └─────────────┘   └─────────┬─────────┘
                                  │ Prisma queries
                                  ▼
                        ┌───────────────────┐
                        │   PostgreSQL 17   │
                        │  (shared schema)  │
                        └─────────▲─────────┘
                                  │ pgx: due monitors
                                  │ & check results
                        ┌─────────┴─────────┐
                        │  Go poller worker │
                        │ (checker registry)│
                        └─────────┬─────────┘
                                  │ SSRF-filtered
                                  │ HTTP/S requests
                                  ▼
                        ┌───────────────────┐
                        │ Configured HTTP / │
                        │   HTTPS targets   │
                        └───────────────────┘
    content:
      en:
        detail: 'Sentinel is a distributed uptime monitoring platform featuring a decoupled NestJS REST API and an independent Go worker for concurrent endpoint verification, designed for production resilience and deployed on AWS.'
        highlights:
          - 'Concurrent Go worker: goroutines with channel-based bounded concurrency and pgxpool, load-tested locally with 5,000 monitors'
          - 'Network security & SSRF defense: custom DNS resolution with socket pinning against DNS rebinding, private IP blocking, and rate limiting'
          - 'Cloud deployment & CI/CD: AWS EC2, Docker Compose, Caddy reverse proxy with automatic HTTPS, and GitHub Actions with 250+ automated tests'
      es:
        detail: 'Sentinel es una plataforma distribuida de monitoreo de disponibilidad con una API REST en NestJS y un worker independiente en Go para verificación concurrente de endpoints, diseñada para alta confiabilidad y desplegada en AWS.'
        highlights:
          - 'Worker concurrente en Go: goroutines con concurrencia acotada por canales y pgxpool, probado bajo carga con 5.000 monitores'
          - 'Seguridad de red y mitigación de SSRF: resolución DNS con socket pinning contra DNS rebinding, bloqueo de IPs privadas y rate limiting'
          - 'Despliegue en la nube y CI/CD: AWS EC2, Docker Compose, Caddy con HTTPS automático y CI en GitHub Actions con más de 250 pruebas automatizadas'
  - id: inteldigest
    name: IntelDigest
    links: 
      github: https://github.com/EliottV17/IntelDigest
    stack:
      - Python
      - FastAPI
      - Pydantic V2
      - PostgreSQL
      - asyncpg
      - Redis Streams
      - aiohttp
      - OpenRouter
      - Next.js
      - Docker
    color: blue
    techIcon: py
    filename: inteldigest.py
    content:
      en:
        detail: 'Asynchronous web article technical digest generator. A FastAPI service ingests URLs with HTTP 202 Accepted and enqueues jobs in Redis Streams. A background worker scrapes content with SSRF-safe networking and leverages OpenRouter to generate structured digests enforced by strict Pydantic JSON schemas, persisting atomic state transitions in PostgreSQL.'
        highlights:
          - 'Asynchronous task queue: decoupled HTTP ingestion from background processing using Redis Streams consumer groups'
          - 'Defensive web scraping: custom aiohttp connector coupling DNS resolution to IP pinning against IANA/RFC 6890 ranges'
          - 'Applied AI & Structured Outputs: enforced JSON Schema contracts via Pydantic for LLM responses and atomic state transitions in PostgreSQL'
      es:
        detail: 'Motor asíncrono de ingesta y análisis técnico de artículos web. Un servicio en FastAPI recibe URLs con HTTP 202 Accepted y encola trabajos en Redis Streams. Un worker en segundo plano extrae contenido con validaciones de red contra SSRF y utiliza OpenRouter para generar resúmenes con esquemas estrictos validados por Pydantic, persistiendo transiciones de estado atómicas en PostgreSQL.'
        highlights:
          - 'Cola de tareas asíncrona: desacoplamiento de la ingesta HTTP y el procesamiento en background mediante grupos de consumidores en Redis Streams'
          - 'Scraping web defensivo: conector aiohttp personalizado con resolución DNS e IP pinning acoplado contra rangos IANA/RFC 6890'
          - 'IA Aplicada y Structured Outputs: contratos gobernados por JSON Schema con Pydantic para respuestas de LLM y transiciones de estado atómicas en PostgreSQL'
  - id: tenantInbox
    name: TenantInbox
    links:
      github: https://github.com/EliottV17/TenantInbox
      web: https://tenant-inbox-ten.vercel.app/inbox
    stack:
      - Next.js (App Router)
      - TypeScript
      - Convex
      - OpenRouter (GLM-5.3-flash)
      - Zod 4
      - Tailwind CSS v4
      - shadcn/ui
      - Bun
      - Vitest
    color: green
    techIcon: ts
    filename: tenantinbox.ts
    diagram: |
      ┌─────────────────┐   ┌─────────────────┐
      │   Inbox form    │   │  POST webhook   │
      └────────┬────────┘   └────────┬────────┘
               │                     │
               ▼                     ▼
      ┌─────────────────┐   ┌─────────────────┐
      │ Create mutation │   │ Webhook handler │
      └────────┬────────┘   └────────┬────────┘
               └──────────┬──────────┘
                          ▼
              ┌───────────────────────┐
              │   Save message: new   │
              └───────────┬───────────┘
                          │
                          ▼
             ┌─────────────────────────┐
             │ Schedule classification │
             └────────────┬────────────┘
                          │
                          ▼
              ┌───────────────────────┐
              │ Classification action │
              └───────────┬───────────┘
                          │
                          ▼
               ┌─────────────────────┐
               │ State + usage guard │
               └──────────┬──────────┘
                          │
                          ▼
          ┌───────────────────────────────┐
          │ OpenRouter structured output  │
          └───────────────┬───────────────┘
                          │
