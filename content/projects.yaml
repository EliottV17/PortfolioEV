projects:
  - id: sentinel
    name: Sentinel
    links:
      github: https://github.com/EliottV17/sentinel-project
      video: https://youtu.be/0To4e1rmMRM
      web: https://sentinel.eliottvelarde.com/status
    stack:
      - TypeScript
      - Go
      - NestJS
      - Postgres
      - PrismaORM
      - JWT
      - CI/CD
      - Jest
    color: red
    techIcon: go
    diagram: |1
     
            ┌────────────────────────┐
            │ Browser / React Client │
            └───────────┬────────────┘
                        │ HTTPS
                        ▼
          ┌─────────────┴────────────────┐
          │     Caddy reverse proxy      │
          │      (production edge)       │
          └──┬────────────────────┬──────┘
             │ other paths        │ /api/* (direct)
             ▼                    ▼
      ┌─────────────┐   ┌───────────────────┐
      │ Nginx (UI)  │   │  NestJS REST API  │
      │ static SPA  │   │ (JWT auth & CRUD) │
      └─────────────┘   └─────────┬─────────┘
                                  │ Prisma queries
                                  ▼
                        ┌───────────────────┐
                        │   PostgreSQL 17   │
                        │  (shared schema)  │
                        └─────────▲─────────┘
                                  │ pgx: due monitors
                                  │ & check results
                        ┌─────────┴─────────┐
                        │  Go poller worker │
                        │ (checker registry)│
                        └─────────┬─────────┘
                                  │ SSRF-filtered
                                  │ HTTP/S requests
                                  ▼
                        ┌───────────────────┐
                        │ Configured HTTP / │
                        │   HTTPS targets   │
                        └───────────────────┘
    content:
      en:
        detail: 'Distributed uptime and latency monitoring platform (NestJS + Go). Benchmarked to process 5,000 concurrent services using <50MB RAM and a strictly bounded 25-connection DB pool. Features FSM-based alerting to reduce notification noise by 99%.'
        highlights:
          - 'Decoupled runtimes: Go worker (pgx pool) + NestJS REST API'
          - 'Pluggable checker registry: new probe protocols without touching the polling loop'
      es:
        detail: 'Plataforma distribuida de monitoreo de disponibilidad y latencia (NestJS + Go). Validada procesando 5,000 servicios concurrentes con <50MB de RAM y un pool acotado de 25 conexiones a BD. Incluye alertas por máquina de estados (FSM) que reducen el ruido operativo en un 99%.'
        highlights:
          - 'Runtimes desacoplados: worker en Go (pool pgx) + API REST en NestJS'
          - 'Registry de checkers: nuevos protocolos de sondeo sin tocar el loop de polling'
