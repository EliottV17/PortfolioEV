         ┌─────────────────────────────────┐
         │ Parse JSON + validate with Zod  │
         └─────┬─────────────────────┬─────┘
               │                     │
               ▼                     ▼
        ┌─────────────┐       ┌─────────────┐
        │ Save result │       │ Mark failed │
        └──────┬──────┘       └──────┬──────┘
               └──────────┬──────────┘
                          ▼
                 ┌─────────────────┐
                 │ Reactive inbox  │
                 └────────┬────────┘
                          │
                          ▼
             ┌─────────────────────────┐
             │ Human reviews and acts  │
             └─────────────────────────┘
    content:
      en:
        detail: 'Real-time web platform that centralizes tenant messages received via form and webhook. An AI agent classifies them by category and urgency, writes a summary and drafts a reply that a person reviews and approves before sending.'
        highlights:
          - 'State-machine pipeline: idempotent transitions (new → classifying → classified | failed)'
          - 'Webhook with shared secret and constant-time comparison; daily classification cap'
          - 'Zod as single source of truth: validates model output and generates the JSON Schema'
      es:
        detail: 'Plataforma web en tiempo real que centraliza los mensajes de inquilinos recibidos por formulario y webhook. Un agente de IA los clasifica por categoría y urgencia, genera un resumen y propone un borrador de respuesta que una persona revisa y aprueba antes de enviarlo.'
        highlights:
          - 'Pipeline como máquina de estados: transiciones idempotentes (new → classifying → classified | failed)'
          - 'Webhook con secreto compartido y comparación en tiempo constante; tope diario de clasificaciones'
          - 'Zod como fuente única de verdad: valida la respuesta del modelo y genera el JSON Schema'
